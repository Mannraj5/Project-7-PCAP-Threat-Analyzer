name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      # The real-capture validation runs against the Purple Team Lab's pcaps.
      - name: Fetch lab captures
        uses: actions/checkout@v5
        with:
          repository: Mannraj5/Project-2-Purple-Team-Lab
          path: lab
          sparse-checkout: pcaps

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify lab capture integrity
        if: runner.os == 'Linux'
        working-directory: lab/pcaps
        run: grep -E '^[0-9a-f]{64}  ' README.md | sha256sum -c

      - name: Test
        env:
          PCAPSCOPE_LAB_CAPTURES: lab/pcaps
        run: python -m pytest -v

      - name: Demo capture is reproducible
        if: runner.os == 'Linux'
        run: |
          python scripts/make_demo_capture.py
          git diff --exit-code samples/demo.pcapng
